#apiId: "438327"  # Enter the apiId of the application here for consistency.
apiId: "0"        # To enable local execution, having the apiId set to 0 is required.

## HTTPS Config ##
https:
  private:
    port: "8094"
  inbound:
    listener: "/api/v1/*"
  request:

## HTTPS Request Config for connection to Customers PL ##
    customers-pl:
      basepath: "/api/v1"
      protocol: "HTTPS"
      host: "localhost"
      port: "8083"
      timeout:
        response: "60000"
        idle: "60000"
      ## Customers PL Endpoints ##
      customers:
        path:             "/customers"
        customerid:
          path:           "/customers/{customerid}"
          deliveries:     "/customers/{customerid}/deliveries"
          subscriptions:  "/customers/{customerid}/subscriptions"

## HTTPS Request Config for connection to Salesforce SL ##
    salesforce-sl:
      basepath: "/api/v1"
      protocol: "HTTPS"
      host:     "localhost"
      port:     "8087"
#      host: "mule-worker-tst-salesforce-sl-ms.de-c1.eu1.cloudhub.io"
#      port: "8092"
      timeout:
        response: "60000"
        idle:     "60000"
      ## Salesforce SL Endpoints ##
      leads:
        path:         "/leads"
        salesforceleadid: 
          path:       "/leads/{salesforceleadid}"
          individual: "/leads/{salesforceleadid}/personindividual"
      accounts:
        path:               "/accounts"
        salesforcecustomerid:
          path:             "/accounts/{salesforcecustomerid}"
          personindividual: "/accounts/{salesforcecustomerid}/personindividual"
          subscriptions:    "/accounts/{salesforcecustomerid}/subscriptions"
          relationship:     "/accounts/{salesforcecustomerid}/relationship"
          personas:         "/accounts/{salesforcecustomerid}/personas"
      customers:
        path:   "/customers"
        salesforcecustomerid:
          path: "/customers/{salesforcecustomerid}"

## HTTPS Request Config for connection to Salesforce Marketing Cloud SL ##
    salesforce-marketing-cloud-sl:
      basepath: "/api/v1"
      protocol: "HTTPS"
      host: "localhost"
      port: "8093"
      timeout:
        response: "60000"
        idle: "60000"
      ## Salesforce Marketing Cloud SL Endpoints ##
      configurators:
        path: "/configurators"
      data-extensions:
        path:   "/data-extensions" ## Not (yet) in use.
        dataExtensionKey:
          path: "/data-extensions/{dataExtensionKey}" ## Not (yet) in use.
          rows: "/data-extensions/{dataExtensionKey}/rows"
      metadata:
        path: "/metadata"

## HTTP Reconnection Strategy Config ##
  reconnection:
    frequency:  "2000" # This is in ms (2 seconds).
    attempts:   "2"

## JSON Logger Config ##
# See: https://blogs.mulesoft.com/dev/api-dev/json-logging-in-mule-4/ for information about the configuration.
jsonlogger:
  application:
    name: "customer-interaction-pl-ms"
    version: "1"
  maskedfields: "$.attributes.headers.authorization" # Any fields which should not be shown in the logging output need to be entered here.
  functional:
    disable: "content"

