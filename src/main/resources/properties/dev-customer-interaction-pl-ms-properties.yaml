#apiId: "438327"  # Enter the apiId of the application here for consistency.
apiId: "0"        # To enable local execution, having the apiId set to 0 is required.

## HTTPS Config ##
https:
  private:
    port: "8094"
  inbound:
    listener: "/api/v1/*"
  request:

## HTTPS Request Config for connection to Customers PL ##
    customers-pl:
      basepath: "/api/v1"
      protocol: "HTTPS"
      host: "localhost"
      port: "8083"
      timeout:
        response: "60000"
        idle: "60000"
      customers:
        path: "/customers"
        id:
          path: "/customers/{customerid}"
      customerssync:
        path: "/customers_sync"
        
## HTTPS Request Config for connection to Insider  ## 
    insider:
      email:
        host: "mail.useinsider.com"
        path: "/mail/v1/send" 
      event:       
        host: "unification.useinsider.com"
        path: "api/user/v1/upsert"   
      port: "443"           
      protocol: "HTTPS"         
      timeout: 
                response: "30000"
                idle: "30000"  
               
## HTTPS Request Config for connection to Salesforce SL ##
    salesforce-sl:
      basepath: "/api/v1"
      protocol: "HTTPS"
#      host: "localhost"
#      port: "8087"
      host: "mule-worker-tst-salesforce-sl-ms.de-c1.eu1.cloudhub.io"
      port: "8092"
      timeout:
        response: "60000"
        idle: "60000"
      customers:
        salesforcecustomerid:
          path: "/customers/{salesforcecustomerid}"
      quotes:
        path: "/quotes"

## HTTPS Request Config for connection to Salesforce Marketing Cloud SL ##
    salesforce-marketing-cloud-sl:
      basepath: "/api/v1"
      protocol: "HTTPS"
      host: "mule-worker-tst-salesforce-marketing-cloud-sl-ms.de-c1.eu1.cloudhub.io"
#      protocol: "HTTPS"
#      host: "localhost"
      port: "8093"
      timeout:
        response: "60000"
        idle: "60000"
      configurators:
        path: "/configurators"
        
## HTTPS Request Config for connection to Customer Reference SL ##
    customer-reference-sl:
      basepath: "/api/v1"
      protocol: "HTTPS"
      host: "mule-worker-tst-customer-reference-sl-ms.de-c1.eu1.cloudhub.io"
      port: "8092"
#      protocol: "HTTPS"
#      host: "localhost"
      timeout:
        response: "60000"
        idle: "60000"
      max-retries: "5"
      millis-between: "4000"
      global:
        id:
          path: "/customers/global/{globalcustomerid}"
      customers:
        id:
          path: "/customers/{customerid}"

## HTTPS Request Config for connection to Document Generation SL ##
    document-generation-sl:
      basepath: "/api/v1"
      protocol: "HTTPS"
#      host: "mule-worker-tst-document-generation-sl-ms.de-c1.eu1.cloudhub.io"
      port: "8095"
      host: "localhost"
      timeout:
        response: "60000"
        idle: "60000"
      documents:
        path: "/documents"

## HTTP Reconnection Strategy Config ##
  reconnection:
    frequency: "2000" # This is in ms (2 seconds).
    attempts: "2"

## Data mappings ##
legalentity:
  salutation:
    default: "Mr. and Mrs."
communication:
  language:
    nl_nl: "nl"
    nl_be: "nl"
    de_de: "de"
    de_at: "de"

## JSON Logger Config ##
jsonlogger:
  application:
    name: "customer-interaction-pl-ms"
    version: "1"
  maskedfields: "$.attributes.headers.authorization"
  functional:
    disable: "content"

