## Azure Service Bus Config ##
azure:
  servicebus:
    namespace: "tst-swiss-sense"

## Azure Service Bus Reconnection Strategy Config ##
    reconnection:
      frequency:  "2000" # This is in ms (2 seconds).
      attempts:   "2"
      
## Azure Service Bus Queues Config ##
    destination:
      quote:
        step1:
          q: "customer-interaction-pl.quote.post.step1.inbound.queue"
          dlq: "customer-interaction-pl.quote.post.step1.inbound.queue/$DeadLetterQueue"
          maxConcurrency: "4"
        step2:
          q: "customer-interaction-pl.quote.post.step2.inbound.queue"
          dlq: "customer-interaction-pl.quote.post.step2.inbound.queue/$DeadLetterQueue"
          maxConcurrency: "4"
        quote-related-mailings:  
           q: "customer-interaction-pl.quote.post.quote-related-mailings.inbound.queue"
           dlq: "customer-interaction-pl.quote.post.quote-related-mailings.inbound.queue/$DeadLetterQueue"
           maxConcurrency: "4"
        insider-event-upsert: 
           q: "customer-interaction-pl.quote.post.insider-event-upsert.inbound.queue"
           dlq: "customer-interaction-pl.quote.post.insider-event-upsert.inbound.queue/$DeadLetterQueue"
           maxConcurrency: "4"  

