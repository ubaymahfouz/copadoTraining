apiId: "438353"

## HTTPS Config ##
https:
  private:
    port: "8092"
  inbound:
    listener: "/api/v1/*"
  request:

## HTTPS Request Config for connection to Customers PL ##
    customers-pl:
      basepath: "/api/v1"
      protocol: "HTTPS"
      host: "mule-worker-internal-prd-customers-pl-ms.de-c1.eu1.cloudhub.io"
      port: "8092"
      timeout:
        response: "60000"
        idle: "60000"
      customers:
        path: "/customers"
        id:
          path: "/customers/{customerid}"
      customerssync:
        path: "/customers_sync"

## HTTPS Request Config for connection to Salesforce SL ##
    salesforce-sl:
      basepath: "/api/v1"
      protocol: "HTTPS"
      host: "mule-worker-internal-prd-salesforce-sl-ms.de-c1.eu1.cloudhub.io"
      port: "8092"
      timeout:
        response: "60000"
        idle: "60000"
      customers:
        salesforcecustomerid:
          path: "/customers/{salesforcecustomerid}"

## HTTPS Request Config for connection to Salesforce Marketing Cloud SL ##
    salesforce-marketing-cloud-sl:
      basepath: "/api/v1"
      protocol: "HTTPS"
      host: "mule-worker-internal-prd-salesforce-marketing-cloud-sl-ms.de-c1.eu1.cloudhub.io"
      port: "8092"
      timeout:
        response: "60000"
        idle: "60000"
      configurators:
        path: "/configurators"

## HTTPS Request Config for connection to Customer Reference SL ##
    customer-reference-sl:
      basepath: "/api/v1"
      protocol: "HTTPS"
      host: "mule-worker-internal-prd-customer-reference-sl-ms.de-c1.eu1.cloudhub.io"
      port: "8092"
      timeout:
        response: "60000"
        idle: "60000"
      global:
        id:
          path: "/customers/global/{globalcustomerid}"
      customers:
        id:
          path: "/customers/{customerid}"

## HTTPS Request Config for connection to Document Generation SL ##
    document-generation-sl:
      protocol: "HTTPS"
      host: "mule-worker-internal-qa-document-generation-sl-ms.de-c1.eu1.cloudhub.io"
      port: "8092"
      basepath: "/api/v1"
      timeout:
        response: "60000"
        idle: "60000"
      documents:
        path: "/documents"

## HTTP Reconnection Strategy Config ##
  reconnection:
    frequency: "2000" # This is in ms (2 seconds).
    attempts: "2"

## Data mappings ##
legalentity:
  salutation:
    default: "Mr. and Mrs."
communication:
  language:
    nl_nl: "nl"
    nl_be: "nl"
    de_de: "de"
    de_at: "de"

## JSON Logger Config ##
jsonlogger:
  application:
    name: "customer-interaction-pl-ms"
    version: "1"
  maskedfields: "$.attributes.headers.authorization"
  functional:
    disable: "content"

