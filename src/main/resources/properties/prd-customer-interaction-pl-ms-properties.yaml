apiId: "438353"

https:
  port: "8094" # Replace by the intended port for the new application. See: https://dms.glomidco.com/s/dts38kMHoLDMnkt for an overview and make sure to add this new application there.
  inbound:
    listener: "/api/v1/*"
  request:

## HTTPS Request Config for connection to Example System ##
    examplesystem:
      basepath: "/api"
      path: "/someEndpointToGetSomething"
      port: "443"
      host: "invalid.thiswillneverwork.butweneedtoenterahosthere.invalid"
      protocol: "HTTPS"
      timeout:
        response: "30000"
        idle: "30000"

## HTTP Reconnection Strategy Config ##
  reconnection:
    frequency:  "2000" # This is in ms (2 seconds).
    attempts:   "2"

## JSON Logger Config ##
# See: https://blogs.mulesoft.com/dev/api-dev/json-logging-in-mule-4/ for information about the configuration.
jsonlogger:
  application:
    name: "customer-interaction-pl-ms"
    version: "1"
  maskedfields: "$.attributes.headers.authorization" # Any fields which should not be shown in the logging output need to be entered here.

## Connection Credentials ##
basic:
  auth:
    examplesystem:
      username: "exampleuser" # Don't forget to encrypt the Username! When encrypting, this comment must be removed because comments break the encryptor.
      password: "examplepass" # Don't forget to encrypt the Password! When encrypting, this comment must be removed because comments break the encryptor.

## Keystores Config ##
keystore:
  type: "JKS"
  path: "keystore/keystore.jks"
  alias: "mule"
  password: "![vrU+BWHXxZJEg3zPeEt2jw==]" # Don't forget to encrypt the Password! When encrypting, this comment must be removed because comments break the encryptor.
truststore:
  type: "JKS"
  path: "keystore/truststore.jks"
  password: "![vrU+BWHXxZJEg3zPeEt2jw==]" # Don't forget to encrypt the Password! When encrypting, this comment must be removed because comments break the encryptor.