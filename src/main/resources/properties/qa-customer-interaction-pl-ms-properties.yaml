apiId: "438328"

## HTTPS Config ##
https:
  private:
    port: "8092"
  inbound:
    listener: "/api/v1/*"
  request:

## HTTPS Request Config for connection to Customers PL ##
    customers-pl:
      basepath: "/api/v1"
      protocol: "HTTPS"
      host: "mule-worker-internal-qa-customers-pl-ms.de-c1.eu1.cloudhub.io"
      port: "8092"
      timeout:
        response: "60000"
        idle: "60000"
      customers:
        path: "/customers"

## HTTPS Request Config for connection to Salesforce SL ##
    salesforce-sl:
      basepath: "/api/v1"
      protocol: "HTTPS"
      host: "mule-worker-internal-qa-salesforce-sl-ms.de-c1.eu1.cloudhub.io"
      port: "8092"
      timeout:
        response: "60000"
        idle: "60000"
      customers:
        salesforcecustomerid:
          path: "/customers/{salesforcecustomerid}"

## HTTPS Request Config for connection to Salesforce Marketing Cloud SL ##
    salesforce-marketing-cloud-sl:
      basepath: "/api/v1"
      protocol: "HTTPS"
      host: "mule-worker-internal-qa-salesforce-marketing-cloud-sl-ms.de-c1.eu1.cloudhub.io"
      port: "8092"
      timeout:
        response: "60000"
        idle: "60000"
      configurators:
        path: "/configurators"
        
## HTTPS Request Config for connection to Customer Reference SL ##
    customer-reference-sl:
      basepath: "/api/v1"
      protocol: "HTTPS"
      host: "mule-worker-internal-qa-customer-reference-sl-ms.de-c1.eu1.cloudhub.io"
      port: "8092"
      timeout:
        response: "60000"
        idle: "60000"
      global:
        id:
          path: "/customers/global/{globalcustomerid}"
          
## HTTP Reconnection Strategy Config ##
  reconnection:
    frequency: "2000" # This is in ms (2 seconds).
    attempts: "2"

## JSON Logger Config ##
jsonlogger:
  application:
    name: "customer-interaction-pl-ms"
    version: "1"
  maskedfields: "$.attributes.headers.authorization"
  functional:
    disable: "content"

